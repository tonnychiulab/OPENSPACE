[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lace"
version = "0.1.0"
description = "Log Anomaly Correlation Engine — offline detection of scans, brute force, beaconing, and exfil volume"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lace = "lace.cli:main"

[tool.setuptools.packages.find]
include = ["lace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
